# freellmapi 심화팩 — 선택 사항. 기본 compose에 넣지 않습니다.
#
# 이유: Hermes 프로세스 하나가 이미 약 2.7GB를 쓰므로, 저사양 VPS 수강생에게 상시 컨테이너를
# 더 얹을 이유가 없습니다. 장애도 분리됩니다(여기가 죽어도 봇은 보조 모델로 계속 동작).
#
# 쓰려면: Hostinger Docker Manager에서 **두 번째 프로젝트**로 이 파일을 붙여넣으세요.
# 기본 compose가 이름 고정 네트워크(hermes-kit)를 만들어 두므로, 여기서는 그 네트워크에 붙습니다.
services:
  freellmapi:
    image: ghcr.io/freellmapi/freellmapi:v0.12.0
    restart: unless-stopped
    volumes:
      - freellmapi-data:/app/server/data
    environment:
      PORT: "3001"
      TZ: Asia/Seoul
    # 학생이 암호화 키를 직접 만들지 않게 합니다. 볼륨에 처음 기동할 때 생성하고 이후 재사용합니다.
    # 키와 암호화된 데이터가 같은 디스크에 있지만, 단일 사용자 VPS에서는 학생의 .env도 같은
    # 디스크에 있으므로 차이가 없습니다. 공유 호스트로 옮길 때에만 외부화하세요.
    entrypoint:
      - sh
      - -c
      - |
        k=/app/server/data/.enc
        [ -s "$$k" ] || head -c 32 /dev/urandom | base64 > "$$k"
        export ENCRYPTION_KEY="$$(cat "$$k")"
        exec /docker-entrypoint.sh "$$@"
      - --
      - serve
    # 포트를 공개하지 않습니다 — Hermes가 네트워크 이름으로 접근하고, 대시보드는 인터넷에서
    # 닿을 수 없어야 합니다.
    networks: [hermes-kit]

volumes:
  freellmapi-data: {}

networks:
  hermes-kit: {name: hermes-kit, external: true}
