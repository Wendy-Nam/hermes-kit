# hermes-kit — 이것을 복사해서 Hostinger Docker Manager의 Compose 칸에 붙여넣으세요.
#
# 환경변수는 봇 토큰 하나입니다:
#   DISCORD_BOT_TOKEN  — Discord Developer Portal에서 만든 봇의 토큰
#
# 나머지 키(Gemini·Groq·Webshare 등)는 디스코드에서 /setup 으로 입력합니다.
# 채팅창에 키를 붙여넣지 마세요 — 세션 기록에 남습니다.
services:
  hermes:
    depends_on:
      swap-init:
        condition: service_completed_successfully
      syncthing-init:
        condition: service_completed_successfully
    image: ghcr.io/wendy-nam/hermes-kit:0.21.2-k15
    restart: unless-stopped
    volumes:
      - hermes-data:/opt/data
      - vaults:/opt/data/vaults                 # 볼트(work, personal)만 별도 볼륨 → syncthing과 공유
      - syncthing-config:/opt/syncthing-config:ro  # 플러그인이 config.xml에서 REST API 키를 읽는다
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      TZ: Asia/Seoul
    command: ["gateway", "run"]

  # 새 config 볼륨은 root 소유이므로 일반 사용자로 실행할 Syncthing보다 먼저 초기화합니다.
  syncthing-init:
    image: syncthing/syncthing:1.27.10@sha256:311f1e1d9fe6e4237ad690726e2af8c3c8a9cb03e4dbc0583c9307e32324e5b9
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 10000:10000 /var/syncthing/config /var/syncthing/vaults && chmod 700 /var/syncthing/config"]
    network_mode: none
    restart: "no"
    volumes:
      - syncthing-config:/var/syncthing/config
      - vaults:/var/syncthing/vaults

  # 4GB VPS 보호: 메모리가 7GB 미만이고 스왑이 없으면 2GB 스왑 파일을 한 번 만듭니다(디스크 6GB 이상 여유일 때만).
  # 순간적으로 메모리가 몰려도 봇이 강제 종료되지 않고 잠깐 느려지게 합니다. 이미 스왑이 있거나 8GB면 아무것도 안 합니다.
  # 호스트에 스왑을 켜야 해서 privileged로 한 번 실행되고 끝납니다(종료 0이 정상). 실패해도 봇 시작을 막지 않습니다.
  swap-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    privileged: true
    network_mode: none
    restart: "no"
    volumes: ["/:/host"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        m() { awk -v k="$$1:" '$$1==k{print $$2}' "$${MEMINFO:-/proc/meminfo}"; }
        run() { if [ -n "$$KIT_SWAP_DRY" ]; then echo "would: $$*"; else "$$@"; fi; }
        if [ "$$(m SwapTotal)" -gt 0 ]; then echo "[swap] 이미 켜져 있음"; exit 0; fi
        if [ "$$(m MemTotal)" -ge 7340032 ]; then echo "[swap] 메모리 충분, 만들지 않음"; exit 0; fi
        if [ "$$(df -Pk /host | awk 'NR==2{print $$4}')" -lt 6291456 ]; then echo "[swap] 디스크 여유 부족, 만들지 않음"; exit 0; fi
        f=/host/swapfile
        new=; [ -e "$$f" ] || { new=1; run fallocate -l 2G "$$f" || run dd if=/dev/zero of="$$f" bs=1M count=2048; run chmod 600 "$$f"; run mkswap "$$f"; }
        run swapon "$$f" || { if [ -n "$$new" ]; then run rm -f "$$f"; echo "[swap] 켜지 못함 (VPS가 허용하지 않을 수 있음), 새로 만든 파일은 지웠습니다"; else echo "[swap] 켜지 못함 (VPS가 허용하지 않을 수 있음), 기존 swapfile은 그대로 두었습니다"; fi; exit 0; }
        grep -q '^/swapfile ' /host/etc/fstab || run sh -c "echo '/swapfile none swap sw 0 0' >> /host/etc/fstab"
        echo "[swap] 2GB 스왑을 켰습니다"

  syncthing:
    depends_on:
      syncthing-init:
        condition: service_completed_successfully
    image: syncthing/syncthing:1.27.10@sha256:311f1e1d9fe6e4237ad690726e2af8c3c8a9cb03e4dbc0583c9307e32324e5b9
    environment:
      PUID: "10000"
      PGID: "10000"
      TZ: Asia/Seoul
    restart: unless-stopped
    volumes:
      - vaults:/var/syncthing/vaults           # hermes 데이터 전체(.env 포함)는 절대 마운트하지 않는다
      - syncthing-config:/var/syncthing/config
    ports: ["22000:22000/tcp", "22000:22000/udp", "127.0.0.1:8384:8384"]

volumes: {hermes-data: {}, vaults: {}, syncthing-config: {}}
networks: {default: {name: hermes-kit}}   # 심화팩(OmniRoute)이 external로 합류