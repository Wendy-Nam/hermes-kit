name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this exact version (e.g. 0.21.2-k7) after every check passes; main only. Leave empty to only verify."
        required: false
        default: ""
permissions:
  contents: write   # the dispatched release creates its v* tag after publishing
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: |
          python3 -m pip install -q pyyaml
          python3 -m unittest discover -s tests -v
          cd plugins/kit-setup && python3 -m unittest discover -s tests -v
      - name: student Compose versions and companion image exist
        run: |
          python3 - <<'PYCODE'
          import yaml
          from pathlib import Path
          versions = dict(line.split("=", 1) for line in Path("versions.env").read_text().splitlines() if "=" in line and not line.startswith("#"))
          services = yaml.safe_load(Path("docker-compose.yml").read_text())["services"]
          expected = f"ghcr.io/wendy-nam/hermes-kit:{versions['HERMES_VERSION']}-k{versions['KIT_VERSION']}"
          assert services["hermes"]["image"] == expected, "Compose and release version differ"
          Path("/tmp/kit-companion-image").write_text(services["syncthing"]["image"])
          PYCODE
          docker manifest inspect "$(cat /tmp/kit-companion-image)" >/dev/null
      - name: swap-init really turns swap on for a 4GB host (disposable runner)
        run: |
          python3 -c "import yaml;d=yaml.safe_load(open('docker-compose.yml'));open('/tmp/swap.sh','w').write(d['services']['swap-init']['command'][0].replace('\$\$','\$'))"
          sudo swapoff -a; sudo rm -f /swapfile; sudo sed -i '/^\/swapfile /d' /etc/fstab   # the runner ships its own swapfile
          printf 'MemTotal:        3995000 kB\nSwapTotal:             0 kB\n' > /tmp/m4
          img=$(python3 -c "import yaml;print(yaml.safe_load(open('docker-compose.yml'))['services']['swap-init']['image'])")
          docker run --rm --privileged -e MEMINFO=/w/m4 -v /tmp/m4:/w/m4:ro -v /tmp/swap.sh:/w/swap.sh:ro -v /:/host "$img" sh /w/swap.sh
          swapon --show | grep -q '^/swapfile' && grep -q '^/swapfile ' /etc/fstab
          docker run --rm --privileged -e MEMINFO=/w/m4 -v /tmp/m4:/w/m4:ro -v /tmp/swap.sh:/w/swap.sh:ro -v /:/host "$img" sh /w/swap.sh
          test "$(grep -c '^/swapfile ' /etc/fstab)" = 1
          sudo swapoff /swapfile && sudo rm -f /swapfile && sudo sed -i '/^\/swapfile /d' /etc/fstab
      - name: build (patch anchors fail the build on base-version drift)
        run: |
          set -a; . ./versions.env; set +a
          docker build --build-arg HERMES_BASE_IMAGE --build-arg HERMES_VERSION --build-arg RTK_VERSION --build-arg KIT_VERSION -t hermes-kit:ci .
      - name: setup tests against the shipped Hermes runtime
        run: |
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci -m unittest discover -s /opt/kit/plugins/kit-setup/tests -v
          docker run --rm --network none -v "$PWD/scripts/setup-smoke.py:/tmp/setup-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/setup-smoke.py
      - name: stored skill prompts upgrade without losing student context
        run: docker run --rm --network none -v "$PWD/scripts/skill-reuse-smoke.py:/tmp/skill-reuse-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/skill-reuse-smoke.py
      - name: incomplete cron runs cannot become successful ledger entries
        run: docker run --rm --network none -v "$PWD/scripts/cron-outcome-smoke.py:/tmp/cron-outcome-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/cron-outcome-smoke.py
      - name: ported server patches (kanban notify, policy hook serialization) behave
        run: docker run --rm --network none -v "$PWD/scripts/kanban-hook-smoke.py:/tmp/kanban-hook-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/kanban-hook-smoke.py
      - name: optional OMH enhancement keeps bot profiles intact (real Hermes host)
        run: docker run --rm -v "$PWD/scripts/omh-enhancement-smoke.py:/tmp/omh-enhancement-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/omh-enhancement-smoke.py
      - name: role profiles are created by the real Hermes CLI without the bot token
        run: docker run --rm --network none -v "$PWD/scripts/roles-smoke.py:/tmp/roles-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/roles-smoke.py
      - name: opt-in JS page extractor installs on the image Chromium and refuses internal URLs
        run: docker run --rm -u hermes -v "$PWD/scripts/jsextract-smoke.py:/tmp/jsextract-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/jsextract-smoke.py
      - name: voice patches behave
        run: docker run --rm --entrypoint sh hermes-kit:ci -c "cd /opt/kit/patches/voice && /opt/hermes/.venv/bin/python verify.py --root /opt/hermes"
      - name: secret scan (nothing personal or secret in the public image)
        run: sh scripts/secret-scan.sh hermes-kit:ci
      - name: full student install (fresh volume, /setup wizard to restart, fake model only)
        run: OMNI_IMAGE=ghcr.io/wendy-nam/hermes-kit:omniroute-rtk-json-3 sh scripts/e2e/run.sh hermes-kit:ci
      - name: first-boot seed is correct and idempotent
        run: sh scripts/boot-test.sh hermes-kit:ci
      - name: publish to GHCR (v* tag, or a dispatched release on main; after every check passed)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release != '')
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -a; . ./versions.env; set +a
          if [ -n "$RELEASE" ] && [ "$RELEASE" != "$HERMES_VERSION-k$KIT_VERSION" ]; then
            echo "release input $RELEASE does not match versions.env $HERMES_VERSION-k$KIT_VERSION"; exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/$owner/hermes-kit"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$HERMES_VERSION-k$KIT_VERSION" latest; do docker tag hermes-kit:ci "$img:$t"; docker push "$img:$t"; done
      - name: record the dispatched release as its v* tag
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # A tag pushed with GITHUB_TOKEN does not start another workflow run, so this never publishes twice.
          git tag "v$RELEASE" "$GITHUB_SHA"
          git push origin "v$RELEASE"
