name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: |
          python3 -m pip install -q pyyaml
          python3 -m unittest discover -s tests -v
          cd plugins/kit-setup && python3 -m unittest discover -s tests -v
      - name: build (patch anchors fail the build on base-version drift)
        run: |
          set -a; . ./versions.env; set +a
          docker build --build-arg HERMES_BASE_IMAGE --build-arg HERMES_VERSION --build-arg RTK_VERSION --build-arg KIT_VERSION -t hermes-kit:ci .
      - name: setup tests against the shipped Hermes runtime
        run: |
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci -m unittest discover -s /opt/kit/plugins/kit-setup/tests -v
          docker run --rm --network none -v "$PWD/scripts/setup-smoke.py:/tmp/setup-smoke.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-kit:ci /tmp/setup-smoke.py
      - name: voice patches behave
        run: docker run --rm --entrypoint sh hermes-kit:ci -c "cd /opt/kit/patches/voice && /opt/hermes/.venv/bin/python verify.py --root /opt/hermes"
      - name: secret scan (nothing personal or secret in the public image)
        run: sh scripts/secret-scan.sh hermes-kit:ci
      - name: first-boot seed is correct and idempotent
        run: sh scripts/boot-test.sh hermes-kit:ci
      - name: publish to GHCR (tags only, after every check passed)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -a; . ./versions.env; set +a
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/$owner/hermes-kit"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$HERMES_VERSION-k$KIT_VERSION" latest; do docker tag hermes-kit:ci "$img:$t"; docker push "$img:$t"; done
